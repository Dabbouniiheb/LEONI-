<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 Forbidden | LEONI Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link href="/assets/css/leoni.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card auth-message-card">
        <div class="login-card-header">
          <div class="brand-logo brand-logo-warning">
            <i class="fa-solid fa-lock auth-message-icon"></i>
          </div>
          <h1 class="h4 mb-1">403 — Access Forbidden</h1>
          <p class="text-muted mb-0">You do not have permission to access this resource.</p>
        </div>
        <div class="login-card-body">
          <p class="mb-4 text-muted">
            If you believe this is an error, please contact your Team Leader or system administrator.
          </p>
          <div class="d-flex flex-column gap-2">
            <a href="/dashboard" class="btn btn-leoni-primary w-100">
              <i class="fa-solid fa-gauge-high me-2"></i>Go to Dashboard
            </a>
            <a href="/login" class="btn btn-leoni-outline w-100">
              <i class="fa-solid fa-right-from-bracket me-2"></i>Sign in with another account
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
