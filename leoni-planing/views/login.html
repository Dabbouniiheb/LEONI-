<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | LEONI Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link href="/assets/css/leoni.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-card-header">
          <div class="brand-logo">L</div>
          <h1 class="h4 mb-1">LEONI Planning System</h1>
          <p class="text-muted mb-0">Sign in to access the admin dashboard</p>
        </div>
        <div class="login-card-body">
          <div id="loginAlert" class="alert alert-danger alert-leoni d-none" role="alert"></div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="name@leoni.com"
                required
                autocomplete="username"
              />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn btn-leoni-primary w-100" id="loginBtn">
              <span id="loginBtnText">Sign in</span>
              <span id="loginBtnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/login.js"></script>
  </body>
</html>
