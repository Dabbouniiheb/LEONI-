<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select group | LEONI Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link href="/assets/css/leoni.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-card-header">
          <div class="brand-logo">L</div>
          <h1 class="h4 mb-1">Home Office group</h1>
          <p class="text-muted mb-0">Veuillez sélectionner votre groupe Home Office</p>
        </div>
        <div class="login-card-body">
          <div id="groupAlert" class="alert alert-danger alert-leoni d-none" role="alert"></div>
          <form id="selectGroupForm" novalidate>
            <div class="mb-4">
              <label for="groupSelect" class="form-label">Your group</label>
              <select class="form-select" id="groupSelect" required>
                <option value="">Choose group…</option>
                <option value="1">Group A</option>
                <option value="2">Group B</option>
              </select>
            </div>
            <button type="submit" class="btn btn-leoni-primary w-100" id="submitBtn">
              <span id="submitBtnText">Continue to dashboard</span>
              <span id="submitBtnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/select-group.js"></script>
  </body>
</html>
